openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tabdeel - Barter Exchange Platform API for Jordan
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User profiles
  - name: listings
    description: Barter listings
  - name: categories
    description: Item categories
  - name: swapRequests
    description: Swap/barter requests
  - name: messages
    description: In-app messaging
  - name: ratings
    description: User ratings
  - name: reports
    description: Reports and moderation
  - name: notifications
    description: User notifications
  - name: admin
    description: Admin panel

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # ─── USERS ──────────────────────────────────────────────────────────────────
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update own profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/listings:
    get:
      operationId: getUserListings
      tags: [users]
      summary: Get user's listings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /users/{id}/ratings:
    get:
      operationId: getUserRatings
      tags: [users]
      summary: Get user ratings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRatingsResponse"

  # ─── CATEGORIES ─────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: Get all categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # ─── LISTINGS ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: List/search listings
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
            enum: [new, used, good]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/featured:
    get:
      operationId: getFeaturedListings
      tags: [listings]
      summary: Get featured/promoted listings
      responses:
        "200":
          description: Featured listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings/stats:
    get:
      operationId: getListingsStats
      tags: [listings]
      summary: Platform stats - total listings, by category counts
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsStats"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get listing details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Not found
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update own listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete own listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /listings/{id}/feature:
    post:
      operationId: featureListing
      tags: [listings]
      summary: Promote listing to featured
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Featured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  # ─── SWAP REQUESTS ──────────────────────────────────────────────────────────
  /swap-requests:
    get:
      operationId: getSwapRequests
      tags: [swapRequests]
      summary: Get my swap requests (sent and received)
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sent, received]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, completed]
      responses:
        "200":
          description: Swap requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SwapRequest"
    post:
      operationId: createSwapRequest
      tags: [swapRequests]
      summary: Request a swap on a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapRequestInput"
      responses:
        "201":
          description: Swap request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"

  /swap-requests/{id}/accept:
    patch:
      operationId: acceptSwapRequest
      tags: [swapRequests]
      summary: Accept a swap request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"

  /swap-requests/{id}/reject:
    patch:
      operationId: rejectSwapRequest
      tags: [swapRequests]
      summary: Reject a swap request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"

  /swap-requests/{id}/complete:
    patch:
      operationId: completeSwapRequest
      tags: [swapRequests]
      summary: Mark swap as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapRequest"

  # ─── MESSAGES ───────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: getConversations
      tags: [messages]
      summary: Get all conversations (accepted swap requests with messages)
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{swapRequestId}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages in a conversation
      parameters:
        - name: swapRequestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: swapRequestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/{swapRequestId}/read:
    patch:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark all messages in conversation as read
      parameters:
        - name: swapRequestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read

  # ─── RATINGS ────────────────────────────────────────────────────────────────
  /ratings:
    post:
      operationId: createRating
      tags: [ratings]
      summary: Rate a user after completing a swap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  # ─── REPORTS ────────────────────────────────────────────────────────────────
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Report a listing or user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted

  # ─── NOTIFICATIONS ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read

  # ─── IMAGE UPLOAD ────────────────────────────────────────────────────────────
  /upload:
    post:
      operationId: uploadImage
      tags: [listings]
      summary: Upload an image (returns URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "200":
          description: Image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"

  # ─── ADMIN ──────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/users/{id}/ban:
    patch:
      operationId: banUser
      tags: [admin]
      summary: Ban or unban a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanInput"
      responses:
        "200":
          description: Updated

  /admin/listings:
    get:
      operationId: getAdminListings
      tags: [admin]
      summary: List all listings (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"

  /admin/listings/{id}:
    delete:
      operationId: adminDeleteListing
      tags: [admin]
      summary: Delete a listing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/reports:
    get:
      operationId: getAdminReports
      tags: [admin]
      summary: Get all reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, dismissed]
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /admin/reports/{id}:
    patch:
      operationId: resolveReport
      tags: [admin]
      summary: Resolve or dismiss a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

# ─── SCHEMAS ────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # AUTH
    RegisterInput:
      type: object
      required: [name, email, password, phone, city]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
        phone:
          type: string
        city:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # USERS
    User:
      type: object
      required: [id, name, email, phone, city, avatarUrl, rating, ratingCount, isAdmin, isBanned, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        city:
          type: string
        avatarUrl:
          type: ["string", "null"]
        rating:
          type: number
        ratingCount:
          type: integer
        isAdmin:
          type: boolean
        isBanned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      required: [id, name, city, avatarUrl, rating, ratingCount, listingsCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        avatarUrl:
          type: ["string", "null"]
        rating:
          type: number
        ratingCount:
          type: integer
        listingsCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        city:
          type: string
        avatarUrl:
          type: string

    UserRatingsResponse:
      type: object
      required: [ratings, avgRating, totalCount]
      properties:
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
        avgRating:
          type: number
        totalCount:
          type: integer

    # CATEGORIES
    Category:
      type: object
      required: [id, name, slug, icon]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        listingsCount:
          type: integer

    # LISTINGS
    Listing:
      type: object
      required: [id, title, description, condition, wantsInExchange, city, images, category, owner, isFeatured, isActive, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        condition:
          type: string
          enum: [new, used, good]
        wantsInExchange:
          type: string
        city:
          type: string
        images:
          type: array
          items:
            type: string
        category:
          $ref: "#/components/schemas/Category"
        owner:
          $ref: "#/components/schemas/UserProfile"
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ListingDetail:
      type: object
      required: [id, title, description, condition, wantsInExchange, city, images, category, owner, isFeatured, isActive, createdAt, swapRequestCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        condition:
          type: string
          enum: [new, used, good]
        wantsInExchange:
          type: string
        city:
          type: string
        images:
          type: array
          items:
            type: string
        category:
          $ref: "#/components/schemas/Category"
        owner:
          $ref: "#/components/schemas/UserProfile"
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        swapRequestCount:
          type: integer

    ListingInput:
      type: object
      required: [title, description, condition, wantsInExchange, categoryId, city]
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
        condition:
          type: string
          enum: [new, used, good]
        wantsInExchange:
          type: string
        categoryId:
          type: integer
        city:
          type: string
        images:
          type: array
          items:
            type: string

    ListingUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        condition:
          type: string
          enum: [new, used, good]
        wantsInExchange:
          type: string
        categoryId:
          type: integer
        city:
          type: string
        images:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    ListingsResponse:
      type: object
      required: [listings, total, page, totalPages]
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer

    ListingsStats:
      type: object
      required: [total, featured, byCategory]
      properties:
        total:
          type: integer
        featured:
          type: integer
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    CategoryCount:
      type: object
      required: [categoryId, name, count]
      properties:
        categoryId:
          type: integer
        name:
          type: string
        count:
          type: integer

    # SWAP REQUESTS
    SwapRequest:
      type: object
      required: [id, listing, requester, status, createdAt]
      properties:
        id:
          type: integer
        listing:
          $ref: "#/components/schemas/Listing"
        requester:
          $ref: "#/components/schemas/UserProfile"
        message:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, completed]
        createdAt:
          type: string
          format: date-time

    SwapRequestInput:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: integer
        message:
          type: string

    # MESSAGES
    Message:
      type: object
      required: [id, swapRequestId, sender, content, isRead, createdAt]
      properties:
        id:
          type: integer
        swapRequestId:
          type: integer
        sender:
          $ref: "#/components/schemas/UserProfile"
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        imageUrl:
          type: string

    Conversation:
      type: object
      required: [swapRequestId, otherUser, listing, lastMessage, unreadCount, status]
      properties:
        swapRequestId:
          type: integer
        otherUser:
          $ref: "#/components/schemas/UserProfile"
        listing:
          $ref: "#/components/schemas/Listing"
        lastMessage:
          type: ["string", "null"]
        unreadCount:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected, completed]

    # RATINGS
    Rating:
      type: object
      required: [id, rater, rated, stars, createdAt]
      properties:
        id:
          type: integer
        rater:
          $ref: "#/components/schemas/UserProfile"
        rated:
          $ref: "#/components/schemas/UserProfile"
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RatingInput:
      type: object
      required: [ratedId, swapRequestId, stars]
      properties:
        ratedId:
          type: integer
        swapRequestId:
          type: integer
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    # REPORTS
    Report:
      type: object
      required: [id, reporter, targetType, targetId, reason, status, createdAt]
      properties:
        id:
          type: integer
        reporter:
          $ref: "#/components/schemas/UserProfile"
        targetType:
          type: string
          enum: [listing, user]
        targetId:
          type: integer
        reason:
          type: string
        status:
          type: string
          enum: [pending, resolved, dismissed]
        createdAt:
          type: string
          format: date-time

    ReportInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [listing, user]
        targetId:
          type: integer
        reason:
          type: string

    ResolveReportInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]

    # NOTIFICATIONS
    Notification:
      type: object
      required: [id, type, title, body, isRead, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [swap_request, swap_accepted, swap_rejected, new_message, rating]
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        relatedId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    # UPLOAD
    ImageUploadInput:
      type: object
      required: [base64]
      properties:
        base64:
          type: string
        filename:
          type: string

    ImageUploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    # ADMIN
    AdminStats:
      type: object
      required: [totalUsers, totalListings, totalSwaps, totalReports, newUsersThisWeek, newListingsThisWeek]
      properties:
        totalUsers:
          type: integer
        totalListings:
          type: integer
        totalSwaps:
          type: integer
        totalReports:
          type: integer
        newUsersThisWeek:
          type: integer
        newListingsThisWeek:
          type: integer

    AdminUsersResponse:
      type: object
      required: [users, total, page, totalPages]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer

    BanInput:
      type: object
      required: [banned]
      properties:
        banned:
          type: boolean
